<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>jassm.de</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #2b2a27;
    --muted: #7a766c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b19; --ink: #ece8df; --muted: #9a958a; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 16px;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { text-align: center; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>jassm.de</h1>
  <p>Diese Seite ist im Aufbau.</p>
